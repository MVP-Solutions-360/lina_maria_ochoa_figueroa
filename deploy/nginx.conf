# Nginx del contenedor del sitio estático de Lina María Ochoa Figueroa.
# Se copia a /etc/nginx/conf.d/lina-ochoa.conf (que Nginx incluye dentro de `http {}`).
# TLS, redirección http→https y HSTS los gestiona Nginx Proxy Manager, no este contenedor.

# Política de caché por ruta. Se calcula con $uri para poder enviar UN solo encabezado
# Cache-Control a nivel de servidor (los `add_header` de un location anularían los del servidor).
#   - /assets/*: archivos con hash en el nombre -> caché de un año e inmutables.
#   - imágenes y fuentes públicas sin hash (favicon, og-image, /images/*): un día.
#   - todo lo demás (HTML, sitemap.xml, robots.txt, 404.html, /healthz): sin caché, para que
#     un nuevo despliegue se vea de inmediato.
map $uri $lina_cache_control {
    default                                                   "no-cache";
    ~^/assets/                                                "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|webp|svg|ico|gif|avif|woff2?)$           "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Nunca generar redirecciones absolutas (con host/puerto internos) detrás del proxy.
    absolute_redirect off;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               text/javascript image/svg+xml;

    add_header Cache-Control $lina_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprobación de salud sencilla (también la usa el HEALTHCHECK del contenedor).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recursos versionados por Vite: si no existen, 404 (sin caer en index.html).
    location /assets/ {
        try_files $uri =404;
    }

    # Sin archivos ocultos.
    location ~ /\. {
        return 404;
    }

    # Cada ruta pública tiene su propio index.html (/perfil-profesional/index.html, etc.):
    #   /perfil-profesional    -> $uri/index.html
    #   /perfil-profesional/   -> $uri/index.html
    # No se usa `$uri/` para evitar la redirección 301 de "agregar barra final".
    # Cualquier otra ruta responde 404 con la página personalizada.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Página 404 personalizada conservando el estado HTTP 404 (sin "=404" en error_page).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
